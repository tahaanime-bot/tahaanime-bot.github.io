<style>
:root{--bg1:#2b0b16;--bg2:#0c0a14;--bg3:#1c0c35;--card:#2a1622;--line:#43283a;--text:#f6eef2;--mute:#b6a2ae;--red:#e11d48;--teal:#3fdccb;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg2)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--text);font-family:"Tajawal",Tahoma,sans-serif;line-height:1.6;background:linear-gradient(180deg,var(--bg1),var(--bg2) 45%,var(--bg3)) fixed;padding-bottom:84px}
button{font:inherit;color:inherit}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding:12px 14px;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(8px)}
header .sp{flex:1}
header h1{font-size:19px;font-weight:700;margin:0}
.ic{background:none;border:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.v{display:none}.v.on{display:block}
.hero{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 16px 6px;scrollbar-width:none}
.hero::-webkit-scrollbar,.row::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.slide{flex:none;width:86%;aspect-ratio:16/10;border-radius:24px;scroll-snap-align:center;position:relative;cursor:pointer;box-shadow:0 0 26px rgba(225,29,72,.28);overflow:hidden}
.slide div{position:absolute;inset:auto 0 0 0;padding:44px 20px 16px;background:linear-gradient(transparent,rgba(0,0,0,.78))}
.slide h2{font-size:24px;margin:0;font-weight:700}
.pg{display:flex;justify-content:center;gap:8px;margin:12px 0 0}
.pg i{width:12px;height:12px;border-radius:8px;background:#5a4a55;transition:width .2s}
.pg i.on{width:44px;background:var(--red)}
.sec{margin-top:24px}
.sh{display:flex;justify-content:space-between;align-items:baseline;padding:0 16px 10px}
.sh h3{font-size:18px;margin:0;font-weight:700}
.sh button{background:none;border:0;color:var(--mute);cursor:pointer}
.row{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.c{flex:none;width:150px;cursor:pointer;background:var(--card);border-radius:16px;overflow:hidden;padding-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:8px 16px}
.grid .c{width:auto}
.c .p{aspect-ratio:2/3;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-family:"Reem Kufi",sans-serif;font-size:21px;line-height:1.25;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.c b{display:block;padding:10px 12px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.c small{display:block;padding:0 12px;color:#ffcc4d}
.bd{position:absolute;top:8px;inset-inline-start:8px;border-radius:10px;padding:1px 10px;font-size:13px;font-weight:700;font-family:"Tajawal",sans-serif;text-shadow:none}
.bd.done{background:var(--red)}.bd.live{background:#1f9d6b}
.yr{position:absolute;bottom:8px;inset-inline:8px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.6);border-radius:12px;padding:2px 10px;font-size:13px;font-family:"Tajawal",sans-serif;text-shadow:none}
.yr i{font-style:normal;font-size:18px;padding:0 4px}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px}
.g{height:92px;border-radius:22px;padding:14px;font-weight:700;font-size:18px;position:relative;overflow:hidden;color:#fff;cursor:pointer;border:0;text-align:start}
.g::after{content:"";position:absolute;inset-inline-end:-18px;bottom:-26px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.25)}
.cw{flex:none;width:290px;display:flex;gap:12px;background:var(--card);border-radius:16px;overflow:hidden;cursor:pointer}
.cp{width:96px;min-height:120px}
.ci{flex:1;padding:12px 0;padding-inline-end:14px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.ci b{font-size:20px}.ci span{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:#4a3342;border-radius:4px;margin:10px 0 4px}.bar i{display:block;height:100%;background:var(--red);border-radius:4px}
.search{display:block;width:calc(100% - 32px);margin:10px 16px;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:10px 18px;font:inherit}
.search:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 6px;scrollbar-width:none}

.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red)}

.me{text-align:center;padding:30px 16px;color:var(--mute)}

nav{position:fixed;inset-inline:0;bottom:0;z-index:6;display:flex;justify-content:space-around;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(90deg,#3a0f1f,#1f0d3d)}

dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:0;width:min(780px,94vw);max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(8,5,18,.75)}
.dhead{display:flex;justify-content:space-between;align-items:start;gap:10px;padding:16px 18px 6px}
.dhead h2{margin:0;font-family:"Reem Kufi",sans-serif}
.x{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 10px;cursor:pointer}

.player video{width:100%;height:100%}.player p{padding:16px;margin:0}

.ep{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 12px;cursor:pointer}
.ep[aria-current="true"]{border-color:var(--teal);color:var(--teal)}.ep.seen::after{content:" ✓";color:var(--teal)}
:root[data-theme="light"]{--bg1:#ffe3ea;--bg2:#fbf6fa;--bg3:#ece3ff;--card:#fff;--line:#e6d3dd;--text:#2a1622;--mute:#7b6674;color-scheme:light}
.qr{display:flex;align-items:center;gap:8px;padding-inline-end:16px}.qr .search{flex:1;width:auto}
.grid.list{grid-template-columns:1fr}.grid.list .c{display:grid;grid-template-columns:84px 1fr;align-items:center;padding:0}.grid.list .p{grid-row:1/3}.grid.list .c b{padding-top:0}
.pc{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 6px;align-items:center}
.rt{display:flex;align-items:center;gap:2px;padding:4px 18px;color:var(--mute)}.rt button{background:none;border:0;font-size:24px;color:#ffb81c;cursor:pointer;padding:0 2px}.rt span{margin-inline-end:8px}
.legal{text-align:start;max-width:520px;margin:14px auto}.legal details{background:var(--card);border-radius:12px;margin:8px 0;padding:10px 14px}.legal summary{cursor:pointer;color:var(--text)}
select.chip{color:var(--text)}
.adbox{width:100%;height:100%;position:relative;display:flex;flex-direction:column;background:#111}
.adbox video,.adbox img,.adbox iframe{flex:1;min-height:0;width:100%;object-fit:contain;border:0;background:#000}
.adbox a{flex:1;min-height:0;display:flex}
.adh{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(135deg,#5b3df5,#ff7aa8);color:#fff;padding:12px;font-size:14px}.adh b{font-size:22px;font-family:"Reem Kufi",sans-serif}
.adtag{position:absolute;top:8px;inset-inline-start:8px;background:rgba(0,0,0,.65);color:#fff;padding:0 8px;border-radius:6px;font-size:12px;z-index:1}
.adbar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(0,0,0,.75);color:#fff;font-size:14px}
.adbar .chip:disabled{opacity:.45;cursor:not-allowed}
#admb .search{width:100%;margin:6px 0;border-radius:12px;display:block}#admb h3{margin:18px 0 4px}#admb code{background:var(--bg2);padding:1px 6px;border-radius:6px}#admb .chip{margin:4px 4px 4px 0}
</style>

<script>
/* قائمة الأنمي: العنوان|السنة|التصنيفات|عدد الحلقات (تقريبي)|الوصف */
const RAW=`هجوم العمالقة|2013|أكشن،دراما،خيال|87|البشرية محاصرة خلف أسوار تحميها من عمالقة يأكلون البشر، وشاب يقسم أن ينتقم.
ناروتو|2002|أكشن،مغامرة|220|فتى نينجا منبوذ يحلم بأن يصبح زعيم قريته ويكسب احترام الجميع.
ون بيس|1999|مغامرة،كوميدي|1100|قرصان شاب يبحر مع طاقمه بحثاً عن الكنز الأعظم ليصير ملك القراصنة.
ديث نوت|2006|غموض،إثارة|37|طالب يعثر على دفتر يقتل من يُكتب اسمه فيه، ومحقق عبقري يطارده.
فول ميتال ألكيميست: الأخوة|2009|مغامرة،خيال|64|أخوان يبحثان عن حجر الفيلسوف ليستعيدا ما فقداه بالكيمياء.
دراغون بول زد|1989|أكشن،مغامرة|291|غوكو وأصدقاؤه يدافعون عن الأرض من أعداء قادمين من الفضاء.
قاتل الشياطين|2019|أكشن،خيال|26|فتى يصبح صائد شياطين لينقذ أخته التي تحوّلت إلى شيطانة.
جوجتسو كايسن|2020|أكشن،خيال|47|طالب يبتلع لعنة قوية ويلتحق بمدرسة تدرّب السحرة على محاربة اللعنات.
بليتش|2004|أكشن،خيال|366|مراهق يكتسب قوى حاصد الأرواح ويحمي الأحياء من الأرواح الشريرة.
هنتر × هنتر|2011|مغامرة،أكشن|148|فتى يصبح صياداً محترفاً بحثاً عن والده، ويخوض اختبارات خطيرة.
المدينة المفقودة (سبيريتد أواي)|2001|فيلم،خيال|1|فتاة تضيع في عالم أرواح غريب وعليها إنقاذ والديها.
طوكيو غول|2014|أكشن،رعب|12|طالب جامعي يتحول إلى نصف غول ويعيش بين عالمين متصارعين.
سورد آرت أونلاين|2012|مغامرة،خيال علمي|25|لاعبون عالقون في لعبة واقع افتراضي، والموت فيها يعني الموت حقيقة.
أكاديمية بطلي|2016|أكشن،مدرسي|159|فتى بلا قدرات في عالم الأبطال الخارقين يرث قوة أعظم بطل.
ون بنش مان|2015|أكشن،كوميدي|24|بطل يهزم أي عدو بلكمة واحدة، لكنه يعاني من ملل القوة المطلقة.
موب سايكو 100|2016|كوميدي،خيال|37|فتى يملك قوى نفسية هائلة ويحاول أن يعيش حياة عادية.
كود جياس|2006|خيال علمي،دراما|50|أمير منفي يحصل على قوة الأمر ويقود ثورة ضد إمبراطورية قوية.
شتاينز؛ غيت|2011|خيال علمي،إثارة|24|مجموعة أصدقاء تكتشف طريقة لإرسال رسائل إلى الماضي وتواجه عواقبها.
فيوليت إيفرغاردن|2018|دراما،رومانسي|13|جندية سابقة تعمل كاتبة رسائل وتتعلم معنى المشاعر عبر كلمات الآخرين.
كاوبوي بيبوب|1998|خيال علمي،أكشن|26|صيادو جوائز يجوبون المجموعة الشمسية هرباً من ماضيهم.
نيون جينيسس إيفانجيليون|1995|خيال علمي،دراما|26|مراهقون يقودون روبوتات عملاقة لمحاربة كائنات غامضة تهدد الأرض.
فيري تيل|2009|مغامرة،كوميدي|328|سحرة نقابة مشاغبة يخوضون مهمات ويحمون بعضهم كعائلة واحدة.
رجل المنشار|2022|أكشن،رعب|12|شاب غارق في الديون يندمج مع شيطان كلب ويعمل صائد شياطين.
عائلة الجاسوس|2022|كوميدي،أكشن|37|جاسوس وقاتلة وطفلة قارئة أفكار يتظاهرون بأنهم عائلة عادية.
اسمك (كيمي نو نا وا)|2016|فيلم،رومانسي|1|مراهقان يتبادلان جسديهما في الأحلام ويحاولان لقاء بعضهما.
قلعة هاول المتحركة|2004|فيلم،خيال|1|شابة تتحول إلى عجوز بلعنة ساحرة، وتلجأ إلى قلعة ساحر متنقلة.
يوري على الجليد|2016|رياضة،دراما|12|متزلج على الجليد يفقد ثقته ثم يتدرب على يد بطل عالمي.
هايكيو!!|2014|رياضة،مدرسي|85|فتى قصير القامة يحلم بالتألق في الكرة الطائرة مع فريق مدرسته.
فريرن|2023|مغامرة،خيال|28|ساحرة تسافر بعد رحيل بطل الأسطورة لتفهم ذكرياتها معه.
سولو ليفلينغ|2024|أكشن،مغامرة|25|أضعف صائد وحوش يحصل على قدرة فريدة تجعله يتطور دون حدود.`;
/* روابط الفيديو (للأنمي المحمّل من AniList استخدم المفتاح "a<رقم AniList>:<رقم الحلقة>"): ضع رابط الحلقة بصيغة "رقم الأنمي:رقم الحلقة" (رقم الأنمي حسب ترتيبه في القائمة من 1). */
const VIDEOS={/* "1:1":"https://example.com/ep1.mp4" */};
/* صور الأغلفة: "رقم الأنمي":"رابط الصورة" (صور تملك حق استخدامها). بدونها يظهر غلاف ملوّن. */
const IMAGES={/* "1":"https://example.com/poster1.jpg" */};
const ANIME=RAW.split("\n").map((l,i)=>{const [title,year,g,n,desc]=l.split("|");
 return {id:i+1,title,year:+year,genre:g.split("،"),desc,c:[`hsl(${(i*47)%360} 80% 62%)`,`hsl(${(i*47+70)%360} 60% 28%)`],

function open_(id){
 cur=ANIME.find(a=>String(a.id)===String(id));
 const last=(seen[cur.id]||[]).slice(-1)[0];
 curEp=last?Math.min(last+1,cur.eps.length):1;
 $("#dt").textContent=cur.title;$("#dm").textContent=cur.genre.join(", ")+(cur.year?" • "+cur.year:"");$("#dd").textContent=cur.desc;
 renderRate();play(curEp);$("#dlg").showModal();
 document.title=cur.title+" — أنيفوريا";try{history.replaceState(null,"","#/a/"+encodeURIComponent(cur.id))}catch(e){}
}
function play(n){
 curEp=n;const ep=cur.eps[n-1],p=$("#player"),k=cur.id+":"+n;
 if(ep.url&&!unl.has(k)&&adc>=CFG.adEvery){drawEps();labels();showAd(true,()=>{unl.add(k);adc=0;st("adc",adc);labels();play(n)});return}
 if(ep.url){
  p.innerHTML=`<video controls playsinline src="${esc(ep.url)}">${(SUBS[k]||[]).map((t,i)=>`<track kind="subtitles" srclang="${t[0]}" label="${esc(t[1])}" src="${esc(t[2])}"${i?"":" default"}>`).join("")}</video>`;
  const v=vid();v.playbackRate=+$("#spd").value;
  v.onloadedmetadata=()=>{if(pos[k]&&pos[k]<v.duration-10)v.currentTime=pos[k]};
  v.onplay=()=>{if(!cnt.has(k)){cnt.add(k);adc++;st("adc",adc);labels()}mark(n)};
  v.ontimeupdate=()=>{const t=Date.now();if(t-lastSave>5000){lastSave=t;pos[k]=Math.floor(v.currentTime);st("pos",pos)}};
  v.onended=()=>{delete pos[k];st("pos",pos);if(n<cur.eps.length){play(n+1);const nv=vid();if(nv)nv.play().catch(()=>{})}};
 }else p.innerHTML=`<p>${T.none}<br>#${n}</p>`;
 drawEps();
}
$("#vad").onclick=()=>{const v=vid(),k=cur.id+":"+curEp;if(v){pos[k]=Math.floor(v.currentTime);st("pos",pos);v.pause()}showAd(false,()=>{adc=Math.max(0,adc-1);st("adc",adc);labels();play(curEp)})};
$("#skip").onclick=()=>{const v=vid();if(v)v.currentTime+=85};
$("#nx").onclick=()=>{if(cur&&curEp<cur.eps.length)play(curEp+1)};
$("#spd").onchange=e=>{const v=vid();if(v)v.playbackRate=+e.target.value};
$("#rt").onclick=e=>{const b=e.target.closest("[data-r]");if(b){rate[cur.id]=+b.dataset.r;st("rate",rate);renderRate()}};
$("#vt").onclick=()=>$("#grid").classList.toggle("list");
$("#theme").onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme==="light"?"dark":"light";st("theme",d.dataset.theme);labels()};
let draft={anime:[],videos:{},subs:{},images:{}},adminOK=false;
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,"0")).join("");
function applyCat(c){
 Object.assign(VIDEOS,c.videos||{});Object.assign(SUBS,c.subs||{});Object.assign(IMAGES,c.images||{});
 (c.anime||[]).forEach(m=>{if(ANIME.some(a=>String(a.id)===m.id))return;const h=[...m.id].reduce((x,ch)=>x+ch.charCodeAt(0),0);
  ANIME.unshift({id:m.id,title:esc(m.title),year:+m.year||"",genre:(m.genre||[]).map(esc),desc:esc(m.desc||""),img:m.img||"",st:m.st,c:[`hsl(${h%360} 70% 55%)`,`hsl(${(h+70)%360} 55% 25%)`],eps:Array.from({length:+m.eps||1},(_,k)=>({n:k+1,url:""}))})});
 Object.keys(VIDEOS).forEach(k=>{const[i,n]=k.split(":"),a=ANIME.find(x=>String(x.id)===i);if(a)while(a.eps.length<+n)a.eps.push({n:a.eps.length+1,url:""})});
 ANIME.forEach(a=>a.eps.forEach(e=>{e.url=VIDEOS[a.id+":"+e.n]||""}));
}
async function loadCatalog(){
 let c=ld("cat","null");
 if(!c){try{const r=await fetch("catalog.json",{cache:"no-store"});if(r.ok)c=await r.json()}catch(e){}}
 draft={anime:[],videos:{},subs:{},images:{},...(c||{})};
 applyCat(draft);refresh();route();
}
function commit(m){
 for(let i=ANIME.length;i--;)if(String(ANIME[i].id).startsWith("c"))ANIME.splice(i,1);
 applyCat(draft);st("cat",draft);refresh();adminView();$("#ms").textContent=m;
}
const AH=()=>(draft.settings||{}).adminHash||CFG.adminHash;
function exportCat(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(draft,null,1)],{type:"application/json"}));a.download="catalog.json";a.click()}
async function adminView(){
 const b=$("#admb");
 if(!AH()){b.innerHTML=`<p>إعداد أول مرة: اختر كلمة سر للإدارة وبريداً للتواصل. سيُنشأ ملف catalog.json، ارفعه إلى مستودع GitHub (Add file ← Upload files) ليحلّ محل الموجود.</p><input class="search" id="pw" type="password" placeholder="كلمة سر جديدة (8 أحرف على الأقل)"><input class="search" id="ct" type="email" placeholder="بريد التواصل"><button class="chip" id="mk">إنشاء الملف وتنزيله</button><p id="ms"></p>`;
 $("#mk").onclick=async()=>{const p=$("#pw").value,c=$("#ct").value.trim();if(p.length<8||!c.includes("@")){$("#ms").textContent="أدخل كلمة سر (8 أحرف+) وبريداً صحيحاً";return}
  draft.settings={adminHash:await sha(p),contact:c};st("cat",draft);exportCat();$("#ms").textContent="تم تنزيل catalog.json. ارفعه الآن إلى المستودع."};return}
 if(!adminOK){b.innerHTML=`<input class="search" id="pw" type="password" placeholder="كلمة السر"><button class="chip" id="lg">دخول</button><p id="er" style="color:#ff7a8a"></p>`;$("#lg").onclick=async()=>{if(await sha($("#pw").value)===AH()){adminOK=true;adminView()}else $("#er").textContent="كلمة السر غير صحيحة"};return}
 b.innerHTML=`<h3>إضافة أنمي</h3><input class="search" id="n1" placeholder="العنوان"><input class="search" id="n2" type="number" placeholder="السنة"><input class="search" id="n3" placeholder="التصنيفات (افصل بفاصلة)"><input class="search" id="n4" placeholder="رابط صورة الغلاف (اختياري)"><input class="search" id="n5" type="number" placeholder="عدد الحلقات"><select class="search" id="n6"><option value="done">مكتملة</option><option value="live">يعرض حالياً</option></select><textarea class="search" id="n7" rows="3" placeholder="وصف قصير"></textarea><button class="chip" id="add">إضافة الأنمي</button>
<h3>رابط حلقة</h3><input class="search" id="v1" list="dl" placeholder="اسم الأنمي"><datalist id="dl">${ANIME.map(a=>`<option value="${a.title}">`).join("")}</datalist><input class="search" id="v2" type="number" placeholder="رقم الحلقة"><input class="search" id="v3" placeholder="رابط الفيديو (mp4/webm) — اتركه فارغاً للحذف"><input class="search" id="v4" placeholder="ترجمة (اختياري): ar|العربية|https://.../ar.vtt"><button class="chip" id="sv">حفظ الرابط</button>
<h3>أنمي أضفتَه</h3>${draft.anime.map(m=>`<div>${esc(m.title)} (${m.eps}) <button class="chip" data-del="${m.id}">حذف</button></div>`).join("")||"<p>لا شيء بعد.</p>"}
<h3>البريد</h3><input class="search" id="ct" type="email" value="${esc((draft.settings||{}).contact||"")}"><button class="chip" id="sc">حفظ البريد</button>
<h3>النشر للزوار</h3><p>صدّر الملف وارفعه إلى جذر الموقع باسم <code>catalog.json</code> ليراه الزوار.</p><button class="chip" id="ex">تصدير catalog.json</button><label class="chip">استيراد<input type="file" id="im" accept=".json" hidden></label><button class="chip" id="rs">مسح المسودة</button><p id="ms"></p>`;
 $("#add").onclick=()=>{const t=$("#n1").value.trim();if(!t){$("#ms").textContent="العنوان مطلوب";return}
  draft.anime.push({id:"c"+Date.now().toString(36),title:t,year:$("#n2").value,genre:$("#n3").value.split(/[,،]/).map(x=>x.trim()).filter(Boolean),img:$("#n4").value.trim(),eps:+$("#n5").value||1,st:$("#n6").value,desc:$("#n7").value.trim()});commit("تمت الإضافة")};
 $("#sv").onclick=()=>{const a=ANIME.find(x=>x.title===esc($("#v1").value.trim())),n=+$("#v2").value;if(!a||!n){$("#ms").textContent="اختر أنمي من القائمة وأدخل رقم الحلقة";return}
  const k=a.id+":"+n,u=$("#v3").value.trim();
  if(u)draft.videos[k]=u;else{delete draft.videos[k];delete VIDEOS[k]}
  const p=$("#v4").value.trim().split("|");if(p.length===3)(draft.subs[k]=draft.subs[k]||[]).push(p);
  commit("تم الحفظ")};
 b.onclick=e=>{const d=e.target.closest("[data-del]");if(!d)return;const id=d.dataset.del;draft.anime=draft.anime.filter(m=>m.id!==id);Object.keys(draft.videos).forEach(k=>{if(k.startsWith(id+":")){delete draft.videos[k];delete VIDEOS[k]}});commit("تم الحذف")};
 $("#ex").onclick=exportCat;
 $("#im").onchange=async e=>{try{draft={anime:[],videos:{},subs:{},images:{},...JSON.parse(await e.target.files[0].text())};commit("تم الاستيراد")}catch(x){$("#ms").textContent="ملف غير صالح"}};
 $("#sc").onclick=()=>{draft.settings={...(draft.settings||{}),contact:$("#ct").value.trim()};commit("تم حفظ البريد")};
 $("#rs").onclick=()=>{try{localStorage.removeItem("cat")}catch(e){}location.reload()};
}
$("#admx").onclick=()=>$("#adm").close();
$("#adm").addEventListener("close",()=>{try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}});
function route(){
 if(location.hash==="#/admin"&&!$("#adm").open){$("#adm").showModal();adminView();return}const m=location.hash.match(/^#\/a\/(.+)$/);if(!m||$("#dlg").open)return;const id=decodeURIComponent(m[1]);if(ANIME.some(a=>String(a.id)===id))open_(id)}
function drawEps(){
 const s=seen[cur.id]||[];
 $("#eps").innerHTML=cur.eps.map(e=>`<button class="ep${s.includes(e.n)?" seen":""}" aria-current="${e.n===curEp}" data-n="${e.n}">${e.n}</button>`).join("");
}
$("#eps").onclick=e=>{const b=e.target.closest(".ep");if(b)play(+b.dataset.n)};
$("#close").onclick=()=>$("#dlg").close();
$("#dlg").addEventListener("close",()=>{clearTimeout(timer);$("#player").innerHTML="";document.title=BASE;try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}});
$("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg"))$("#dlg").close()});

/* AniList: يعمل عند نشر الموقع على استضافتك. داخل معاينة claude.ai يُحجب الاتصال فيبقى الكتالوج المحلي */
async function loadAL(){
 try{
  const r=await fetch("https://graphql.anilist.co",{method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({query:`query($p:Int){Page(page:$p,perPage:50){pageInfo{hasNextPage}media(type:ANIME,sort:POPULARITY_DESC,isAdult:false){id title{romaji english}description(asHtml:false)coverImage{large}genres seasonYear episodes averageScore status}}}`,variables:{p:page+1}})});
  const j=(await r.json()).data.Page;page++;
  j.media.forEach(m=>{const t=m.title.english||m.title.romaji,id="a"+m.id;
   if(ANIME.some(a=>a.title.toLowerCase()===t.toLowerCase()))return;
   ANIME.push({id,title:esc(t),year:m.seasonYear,genre:m.genres.map(esc),desc:esc((m.description||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,170)),
    img:m.coverImage.large,score:m.averageScore?(m.averageScore/10).toFixed(2):"",st:m.status==="RELEASING"?"live":"done",
    c:[`hsl(${m.id%360} 70% 55%)`,`hsl(${(m.id+70)%360} 55% 25%)`],
    eps:Array.from({length:m.episodes||12},(_,k)=>({n:k+1,url:VIDEOS[id+":"+(k+1)]||""}))})});
  $("#more").hidden=!j.pageInfo.hasNextPage;$("#credit").hidden=false;refresh();route();
 }catch(e){}
}
$("#more").onclick=loadAL;
setLang(ld("lang",'""')||(navigator.language||"ar").slice(0,2));
document.documentElement.dataset.theme=ld("theme",'"dark"');labels();route();
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
if(CFG.plausible){const sc=document.createElement("script");sc.defer=true;sc.dataset.domain=CFG.plausible;sc.src="https://plausible.io/js/script.js";document.head.append(sc)}
loadCatalog().then(()=>loadAL());
</script>
