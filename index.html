<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موقع الأنمي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#15131d;--card:#1f1c2b;--line:#2f2b42;--text:#ece9f5;--mute:#9a95b3;--accent:#ff6f91}
*{box-sizing:border-box;margin:0}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding:12px 16px}
.logo{font-weight:800;font-size:20px;color:var(--accent);white-space:nowrap}
#q{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 12px;font:inherit}
#q:focus{outline:2px solid var(--accent)}
main{max-width:1000px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:20px 0 10px}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.row .item{flex:0 0 130px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.item img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;background:var(--card);display:block}
.item .t{font-size:14px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{display:inline-block;background:var(--accent);color:#2a0f18;font-size:12px;font-weight:700;border-radius:6px;padding:0 8px;margin-top:4px}
.hero{display:flex;gap:16px;flex-wrap:wrap}
.hero img{width:160px;border-radius:12px}
.hero .info{flex:1;min-width:220px}
.hero h1{font-size:24px}
.meta{color:var(--mute);font-size:14px;margin:4px 0 10px}
.desc{color:var(--mute);font-size:15px;max-width:70ch}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ep{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:block}
.ep:hover{border-color:var(--accent)}
.ep img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.ep span{display:block;padding:8px 10px;font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-size:14px}
.btn:hover{border-color:var(--accent)}
.note{color:var(--mute);padding:20px 0}
.eplist{display:grid;gap:10px}
.epr{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.epr:hover{border-color:var(--accent)}
.epr img{width:110px;aspect-ratio:16/9;object-fit:cover;border-radius:8px}
.epr > div{flex:1;min-width:0}
.btn.play{background:var(--accent);color:#2a0f18;border-color:var(--accent);font-weight:700}
.trailer{width:100%;max-width:640px;aspect-ratio:16/9;border:0;border-radius:12px;display:block}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/">موقع الأنمي</a>
  <input id="q" type="search" placeholder="ابحث عن أنمي...">
</header>
<main id="app"></main>

<script>
const API = "https://graphql.anilist.co";
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const title = t => t.english || t.romaji || t.native || "";

// طلب GraphQL مع تخزين مؤقت 10 دقائق
async function gql(query, variables = {}) {
  const key = "al:" + JSON.stringify([query, variables]);
  try {
    const c = JSON.parse(localStorage.getItem(key) || "null");
    if (c && Date.now() - c.t < 600000) return c.d;
  } catch (e) {}
  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, variables })
  });
  if (!res.ok) throw new Error("تعذّر الاتصال بـ AniList (" + res.status + ")");
  const d = (await res.json()).data;
  try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), d })); } catch (e) {}
  return d;
}

const card = (m, badge) => `
  <a class="item" href="#/anime/${m.id}">
    <img loading="lazy" src="${esc(m.coverImage.large)}" alt="${esc(title(m.title))}">
    <div class="t">${esc(title(m.title))}</div>
    ${badge ? `<span class="badge">${badge}</span>` : ""}
  </a>`;

// الصفحة الرئيسية
async function home() {
  app.innerHTML = '<p class="note">جارٍ التحميل...</p>';
  const now = Math.floor(Date.now() / 1000);
  const d = await gql(`
    query ($from:Int,$to:Int){
      new: Page(perPage:20){
        airingSchedules(airingAt_greater:$from, airingAt_lesser:$to, sort:TIME_DESC){
          episode media{id title{romaji english} coverImage{large}}
        }
      }
      hot: Page(perPage:24){
        media(type:ANIME, sort:TRENDING_DESC){id title{romaji english} coverImage{large}}
      }
    }`, { from: now - 7 * 86400, to: now });
  const seen = new Set();
  const fresh = d.new.airingSchedules.filter(s => !seen.has(s.media.id) && seen.add(s.media.id));
  app.innerHTML = `
    <h2>حلقات جديدة</h2>
    <div class="row">${fresh.map(s => card(s.media, "حلقة " + s.episode)).join("") || '<p class="note">لا توجد حلقات حديثة.</p>'}</div>
    <h2>الأكثر رواجاً</h2>
    <div class="grid">${d.hot.media.map(m => card(m)).join("")}</div>`;
}

// ملف مصادر الحلقات (اختياري) بجانب index.html: episodes.json
async function sources() {
  try { const r = await fetch("episodes.json", { cache: "no-store" }); return r.ok ? await r.json() : {}; }
  catch (e) { return {}; }
}

const ANIME_Q = `
  query ($id:Int){
    Media(id:$id,type:ANIME){
      title{romaji english native} coverImage{large} description(asHtml:false)
      episodes status seasonYear genres trailer{id site} nextAiringEpisode{episode}
      characters(sort:FAVOURITES_DESC, perPage:12){nodes{id name{full} image{large} favourites}}
    }
  }`;
const epCount = m => m.episodes || (m.nextAiringEpisode ? m.nextAiringEpisode.episode - 1 : 0);
const trailerBox = m => m.trailer && m.trailer.site === "youtube"
  ? `<iframe class="trailer" src="https://www.youtube.com/embed/${esc(m.trailer.id)}" allowfullscreen loading="lazy"></iframe>` : "";

// صفحة الأنمي: قائمة الحلقات + الشخصيات
async function detail(id) {
  app.innerHTML = '<p class="note">جارٍ التحميل...</p>';
  const m = (await gql(ANIME_Q, { id })).Media;
  const src = (await sources())[id] || {};
  const n = epCount(m);
  const desc = esc((m.description || "لا يوجد وصف.").replace(/<[^>]+>/g, " "));
  let rows = "";
  for (let i = 1; i <= n; i++) {
    rows += `<a class="epr" href="#/anime/${id}/ep/${i}">
      <img loading="lazy" src="${esc(m.coverImage.large)}" alt="">
      <div><b>الحلقة ${i}</b><div class="meta">${src[i] ? "متاحة" : "لا يوجد مصدر بعد"}</div></div>
      <span class="btn play">شغّل الآن</span></a>`;
  }
  const chars = (m.characters.nodes || []).map(c => `
    <div class="item"><img loading="lazy" src="${esc(c.image.large)}" alt="${esc(c.name.full)}">
    <div class="t">${esc(c.name.full)}</div><div class="meta">♥ ${c.favourites}</div></div>`).join("");
  app.innerHTML = `
    <div class="hero">
      <img src="${esc(m.coverImage.large)}" alt="">
      <div class="info">
        <h1>${esc(title(m.title))}</h1>
        <div class="meta">${[m.seasonYear, n ? n + " حلقة" : "", (m.genres || []).join("، ")].filter(Boolean).map(esc).join(" • ")}</div>
        <p class="desc">${desc}</p>
      </div>
    </div>
    <h2>الحلقات</h2>
    <div class="eplist">${rows || '<p class="note">لم يُعلن عدد الحلقات بعد.</p>'}</div>
    ${m.characters.nodes.length ? `<h2>الشخصيات</h2><div class="row">${chars}</div>` : ""}
    <p class="note"><a class="btn" href="#/">رجوع</a></p>`;
}

// صفحة تشغيل حلقة داخل الموقع
async function player(id, n) {
  app.innerHTML = '<p class="note">جارٍ التحميل...</p>';
  const m = (await gql(ANIME_Q, { id })).Media;
  const url = ((await sources())[id] || {})[n];
  const total = epCount(m);
  let box;
  if (url && /^https:\/\//.test(url)) {
    box = /\.(mp4|webm)(\?|$)/i.test(url)
      ? `<video class="trailer" controls src="${esc(url)}"></video>`
      : `<iframe class="trailer" src="${esc(url)}" allowfullscreen></iframe>`;
  } else {
    box = `${trailerBox(m)}<p class="note">لا يوجد مصدر مرخّص لهذه الحلقة بعد، وهذا الإعلان التشويقي بدلاً منها.</p>`;
  }
  app.innerHTML = `
    <h2>${esc(title(m.title))} - الحلقة ${n}</h2>
    ${box}
    <div class="links">
      ${n > 1 ? `<a class="btn" href="#/anime/${id}/ep/${n - 1}">الحلقة السابقة</a>` : ""}
      ${n < total ? `<a class="btn" href="#/anime/${id}/ep/${n + 1}">الحلقة التالية</a>` : ""}
      <a class="btn" href="#/anime/${id}">كل الحلقات</a>
    </div>`;
}

// البحث
async function search(text) {
  app.innerHTML = '<p class="note">جارٍ البحث...</p>';
  const d = await gql(`
    query ($s:String){
      Page(perPage:30){media(type:ANIME, search:$s){id title{romaji english} coverImage{large}}}
    }`, { s: text });
  app.innerHTML = `<h2>نتائج البحث عن «${esc(text)}»</h2>
    <div class="grid">${d.Page.media.map(m => card(m)).join("") || '<p class="note">لا توجد نتائج.</p>'}</div>`;
}

// التوجيه
async function route() {
  const h = location.hash;
  try {
    if (h.startsWith("#/anime/")) { const p = h.split("/"); const id = parseInt(p[2], 10); if (p[3] === "ep") await player(id, parseInt(p[4], 10)); else await detail(id); }
    else if (h.startsWith("#/search/")) await search(decodeURIComponent(h.slice(9)));
    else await home();
  } catch (e) {
    app.innerHTML = `<p class="note">حدث خطأ: ${esc(e.message)}. أعد المحاولة بعد قليل.</p>`;
  }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
document.getElementById("q").addEventListener("keydown", e => {
  const v = e.target.value.trim();
  if (e.key === "Enter" && v) location.hash = "#/search/" + encodeURIComponent(v);
});
route();
</script>
</body>
</html>
